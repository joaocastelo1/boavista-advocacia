<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500">
  <defs>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E7E1"/>
      <stop offset="0.5" stop-color="#C9C6BD"/>
      <stop offset="1" stop-color="#8B887E"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9B6AC"/>
      <stop offset="1" stop-color="#6F6C64"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CE6E"/>
      <stop offset="1" stop-color="#977A1F"/>
    </linearGradient>
  </defs>

  <ellipse cx="500" cy="620" rx="330" ry="420" fill="url(#halo)"/>

  <!-- Sword -->
  <rect x="640" y="250" width="26" height="150" rx="8" fill="url(#figure)"/>
  <rect x="634" y="392" width="38" height="9" rx="4" fill="url(#gold)"/>
  <rect x="648" y="401" width="10" height="34" fill="url(#figure)"/>
  <circle cx="653" cy="447" r="9" fill="url(#gold)"/>

  <!-- Scales -->
  <rect x="260" y="470" width="130" height="8" rx="4" fill="url(#figure)"/>
  <line x1="325" y1="478" x2="325" y2="556" stroke="url(#figure)" stroke-width="4"/>
  <line x1="395" y1="478" x2="395" y2="556" stroke="url(#figure)" stroke-width="4"/>
  <ellipse cx="325" cy="566" rx="44" ry="16" fill="url(#gold)"/>
  <ellipse cx="395" cy="566" rx="44" ry="16" fill="url(#gold)"/>
  <ellipse cx="325" cy="566" rx="30" ry="9" fill="url(#figure)"/>
  <ellipse cx="395" cy="566" rx="30" ry="9" fill="url(#figure)"/>

  <!-- Left arm holding scales -->
  <path d="M 402 466
    C 380 468 356 470 340 474
    L 338 500
    C 362 490 392 488 412 490 Z"
    fill="url(#figure)"/>

  <!-- Right arm holding sword -->
  <path d="M 598 468
    C 622 476 644 484 652 494
    L 656 520
    C 638 500 616 492 596 488 Z"
    fill="url(#figure)"/>

  <!-- Head and blindfold -->
  <circle cx="500" cy="330" r="58" fill="url(#figure)"/>
  <rect x="468" y="452" width="30" height="26" rx="4" fill="url(#figure)"/>
  <path d="M 444 332 L 556 336 L 557 354 L 443 350 Z" fill="#57534E"/>
  <path d="M 552 332 L 562 322 L 566 330 L 556 342 Z" fill="#57534E"/>
  <path d="M 552 354 L 562 364 L 566 356 L 556 346 Z" fill="#57534E"/>

  <!-- Robe / torso -->
  <path d="M 452 442
    C 470 430 530 430 548 442
    C 566 520 582 596 604 690
    L 622 1000
    L 626 1080
    C 570 1105 430 1105 374 1080
    L 378 1000
    C 400 596 434 520 452 442 Z"
    fill="url(#figure)"/>

  <!-- Robe folds -->
  <path d="M 470 640 C 490 780 500 900 500 1060" stroke="#57534E" stroke-width="5" fill="none" opacity="0.45"/>
  <path d="M 530 640 C 522 780 520 900 522 1060" stroke="#57534E" stroke-width="4" fill="none" opacity="0.35"/>
  <path d="M 436 700 C 452 800 456 900 458 1030" stroke="#57534E" stroke-width="4" fill="none" opacity="0.3"/>

  <!-- Belt -->
  <rect x="452" y="606" width="96" height="18" rx="4" fill="url(#gold)"/>
  <rect x="494" y="604" width="12" height="22" rx="2" fill="#977A1F"/>

  <!-- Column pedestal -->
  <rect x="430" y="1080" width="140" height="60" fill="url(#stone)"/>
  <rect x="452" y="1140" width="96" height="200" fill="url(#stone)"/>
  <line x1="470" y1="1140" x2="470" y2="1340" stroke="#57534E" stroke-width="3" opacity="0.4"/>
  <line x1="500" y1="1140" x2="500" y2="1340" stroke="#57534E" stroke-width="3" opacity="0.4"/>
  <line x1="530" y1="1140" x2="530" y2="1340" stroke="#57534E" stroke-width="3" opacity="0.4"/>
  <rect x="412" y="1340" width="176" height="26" fill="url(#stone)"/>
  <rect x="392" y="1366" width="216" height="30" fill="url(#gold)"/>
  <rect x="366" y="1396" width="268" height="36" fill="url(#stone)"/>
  <rect x="330" y="1432" width="340" height="42" fill="url(#gold)"/>
</svg>
