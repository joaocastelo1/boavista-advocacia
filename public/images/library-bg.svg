<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.5" stop-color="#131313"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <pattern id="books" width="150" height="260" patternUnits="userSpaceOnUse">
      <rect x="8" y="40" width="34" height="220" fill="#202020"/>
      <rect x="12" y="40" width="26" height="220" fill="#262626"/>
      <rect x="46" y="30" width="40" height="230" fill="#1A1A1A"/>
      <rect x="92" y="50" width="30" height="210" fill="#D4AF37" fill-opacity="0.5"/>
      <rect x="126" y="36" width="20" height="224" fill="#2B2B2B"/>
      <line x1="16" y1="120" x2="16" y2="140" stroke="#3A3A3A" stroke-width="2"/>
      <line x1="66" y1="150" x2="66" y2="170" stroke="#3A3A3A" stroke-width="2"/>
      <line x1="106" y1="90" x2="106" y2="110" stroke="#E9CE6E" stroke-width="2"/>
    </pattern>
    <radialGradient id="warm" cx="0.42" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c10"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>

  <g opacity="0.85">
    <rect x="40" y="150" width="1840" height="180" fill="url(#shelf)"/>
    <rect x="40" y="330" width="1840" height="180" fill="url(#shelf)"/>
    <rect x="40" y="510" width="1840" height="180" fill="url(#shelf)"/>
    <rect x="40" y="690" width="1840" height="180" fill="url(#shelf)"/>
    <rect x="40" y="870" width="1840" height="180" fill="url(#shelf)"/>
    <rect x="40" y="300" width="1840" height="30" fill="#0A0A0A"/>
    <rect x="40" y="480" width="1840" height="30" fill="#0A0A0A"/>
    <rect x="40" y="660" width="1840" height="30" fill="#0A0A0A"/>
    <rect x="40" y="840" width="1840" height="30" fill="#0A0A0A"/>
    <rect x="40" y="1020" width="1840" height="30" fill="#0A0A0A"/>
  </g>

  <rect x="60" y="180" width="1800" height="120" fill="url(#books)"/>
  <rect x="60" y="360" width="1800" height="120" fill="url(#books)"/>
  <rect x="60" y="540" width="1800" height="120" fill="url(#books)"/>
  <rect x="60" y="720" width="1800" height="120" fill="url(#books)"/>
  <rect x="60" y="900" width="1800" height="120" fill="url(#books)"/>

  <rect x="0" y="1020" width="1920" height="60" fill="url(#desk)"/>
  <rect x="0" y="0" width="1920" height="140" fill="#0A0A0A"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
