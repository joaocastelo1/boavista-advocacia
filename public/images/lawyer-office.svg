<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2114"/>
      <stop offset="1" stop-color="#151210"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <rect width="880" height="1040" fill="url(#bg)"/>

  <!-- bookshelf -->
  <g opacity="0.7">
    <rect x="60" y="120" width="320" height="300" fill="#0B0B0B"/>
    <rect x="80" y="140" width="280" height="64" fill="#1C1C1C"/>
    <rect x="80" y="228" width="280" height="64" fill="#1C1C1C"/>
    <rect x="80" y="316" width="280" height="64" fill="#1C1C1C"/>
    <rect x="88" y="148" width="22" height="52" fill="#242424"/>
    <rect x="114" y="152" width="30" height="48" fill="#D4AF37" fill-opacity="0.55"/>
    <rect x="148" y="144" width="20" height="56" fill="#1F1F1F"/>
    <rect x="172" y="150" width="26" height="50" fill="#2A2A2A"/>
    <rect x="202" y="146" width="34" height="54" fill="#181818"/>
    <rect x="88" y="236" width="30" height="48" fill="#222222"/>
    <rect x="122" y="232" width="22" height="52" fill="#D4AF37" fill-opacity="0.4"/>
    <rect x="148" y="238" width="28" height="46" fill="#262626"/>
    <rect x="180" y="234" width="24" height="50" fill="#1A1A1A"/>
    <rect x="88" y="324" width="26" height="48" fill="#1F1F1F"/>
    <rect x="118" y="328" width="34" height="44" fill="#D4AF37" fill-opacity="0.5"/>
    <rect x="156" y="322" width="22" height="50" fill="#242424"/>
  </g>

  <!-- window -->
  <rect x="560" y="120" width="240" height="360" rx="6" fill="#0B0B0B"/>
  <rect x="572" y="132" width="216" height="336" fill="#1E2429"/>
  <ellipse cx="680" cy="470" rx="80" ry="18" fill="#2A3036"/>
  <rect x="586" y="150" width="26" height="40" fill="#D4AF37" fill-opacity="0.5"/>
  <rect x="620" y="150" width="20" height="40" fill="#D4AF37" fill-opacity="0.3"/>
  <rect x="720" y="170" width="26" height="40" fill="#D4AF37" fill-opacity="0.45"/>
  <rect x="756" y="150" width="18" height="40" fill="#D4AF37" fill-opacity="0.25"/>
  <line x1="680" y1="132" x2="680" y2="468" stroke="#0B0B0B" stroke-width="8"/>
  <line x1="572" y1="300" x2="788" y2="300" stroke="#0B0B0B" stroke-width="8"/>

  <!-- lamp glow -->
  <circle cx="420" cy="520" r="220" fill="url(#lamp)"/>

  <!-- desk -->
  <path d="M 60 760 L 820 760 L 880 1040 L 0 1040 Z" fill="url(#desk)"/>
  <rect x="60" y="748" width="760" height="16" rx="6" fill="#3A2E1C"/>

  <!-- documents on desk -->
  <g>
    <rect x="220" y="620" width="160" height="120" rx="4" fill="#E8E6E0"/>
    <rect x="228" y="628" width="144" height="8" fill="#BDBDBD"/>
    <rect x="228" y="646" width="120" height="6" fill="#D1CFC8"/>
    <rect x="228" y="662" width="132" height="6" fill="#D1CFC8"/>
    <rect x="228" y="678" width="100" height="6" fill="#D1CFC8"/>
    <rect x="250" y="612" width="150" height="120" rx="4" fill="#F5F4F0"/>
    <rect x="258" y="620" width="134" height="8" fill="#BDBDBD"/>
    <rect x="258" y="638" width="110" height="6" fill="#DCDAD3"/>
    <rect x="258" y="654" width="122" height="6" fill="#DCDAD3"/>
    <rect x="258" y="670" width="96" height="6" fill="#DCDAD3"/>
  </g>

  <!-- seated lawyer silhouette -->
  <path d="M 470 700
    C 430 700 420 640 440 600
    C 452 578 470 572 490 574
    C 512 577 526 590 534 612
    C 540 640 534 690 540 700 Z"
    fill="url(#suit)"/>
  <circle cx="488" cy="540" r="42" fill="#242424"/>
  <path d="M 452 540 C 452 510 472 500 490 500 C 510 500 528 512 528 542 C 526 512 512 502 492 502 C 474 502 458 518 452 540 Z" fill="#3A3A3A"/>
  <rect x="470" y="580" width="38" height="26" fill="url(#suit)"/>
  <rect x="452" y="572" width="72" height="52" rx="10" fill="url(#suit)"/>

  <!-- lamp -->
  <path d="M 620 760 L 620 560" stroke="#2A2114" stroke-width="8"/>
  <path d="M 620 560 C 590 560 570 540 568 510 L 566 500" stroke="#2A2114" stroke-width="8" fill="none"/>
  <rect x="528" y="470" width="40" height="30" rx="6" fill="#2A2114"/>
  <rect x="532" y="474" width="32" height="10" fill="#D4AF37" fill-opacity="0.7"/>

  <rect x="0" y="0" width="880" height="1040" fill="#000" fill-opacity="0.28"/>
</svg>
